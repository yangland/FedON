cuda_device: 2
if_series: True

# defense methods
defense: "AGGR" # "AGGR",
# "krum", "geometric_median", "coordinate_wise_median", "fedavg", "fltrust"
aggr: "multi-krum"
aggr_c_lr: 1.0
aggr_g_lr: 1.0
fltrust_root_iid: True

# sensors
sensor_dir: "saved_models"
sensor_models: []
master_sensor: "none"
sensor_embed_dim: 256

# fl client
n: 100 # total clients 
m: 20 # malicious clients
clients_per_iter: 10
fl_class_num: 100
fl_task: 'cifar100'
c_model: "MobileNetV2_32" #  "ResNet18", "VGG13_32", "SqueezeNet_32", "SimpleCNN_32"
noniid_type: 'dirichlet' # "p-degree", "label_skew"
dirichlet_alphas: [0.3]
# ['none',  'MPAF',  'label_perturbation', 'reverse_grad', 'fang', 'MinMax', 'MinSum', 'LIE', 'FedOda']
attack_methods: ['none',  'MPAF',  'label_perturbation', 'reverse_grad', 'fang', 'MinMax', 'MinSum', 'LIE', 'FedOda', 'FedOda']
# only for reverse_grad, backdoor 
attack_magnitude: 1

image_size: [3, 32, 32]
c_epochs: 1 # 2, 5, 10
c_lr: 0.01
c_momentum: 0.9
client_batch_size: 64

c_scheduler: cosine
c_scheduler_T_max: 500  # Same as total FL iterations if training up to 800 rounds
# c_scheduler: multistep
# c_scheduler_milestones: [400, 600]  # Drop at 50% and 75% of total training
# c_scheduler_gamma: 0.1

fl_iter_num: 500
server_optim_c_lr: 0.005
server_batch_size: 64
server_c_epochs: 1
server_g_epochs: 1


# FedOda parameters
fedoda:
  E: 5
  scaling_factor: 5
  reduce_factor: 0.9
  increase_factor: 1.05
  threshold: 0.6


clients_eval_mode: "cross-eval" # "self-eval", "cross-eval"
