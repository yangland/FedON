cuda_device: 0
if_series: True

# defense methods
defense: "FedEval" # "AGGR", "FedEval"
# "krum", "geometric_median", "coordinate_wise_median", "fedavg", "fltrust"
aggr: "none"
aggr_c_lr: 0.2
aggr_g_lr: 0.7
fltrust_root_iid: False # False, True

# sensors
sensor_dir: "saved_models"
sensor_models: ["cifar10_none_20240906.pth", "svhn_none_20240906.pth"]
master_sensor: "CLIP"

# fl client
n: 20 # total clients 
m: 4 # malicious clients
fl_class_num: 10
fl_task: 'kmnist'
c_model: "Mnist_6L"
g_model: "ContextUnet"
ddmp_seq: 7 # 7 for 28*28, 8 for 32*32
noniid_type: "p-degree"
p-degrees: [0.5]
attack_methods: [ 'none','fakedata', 'backdoor', 'reverse_grad', 'label_perturbation', 'LIE', 'fang']
# only for reverse_grad, backdoor 
attack_magnitude: 5

image_size: [1, 28, 28]
c_epochs: 4 # 2, 5, 10
c_lr: 0.01
c_momentum: 0.9
client_batch_size: 64

g_epochs: 4 # 5, 10
g_lr: 1e-4
# g_batch_size: 256
g_in_channels: 1 # 3 for svhn, 1 for mnist
g_n_feat: 128
unet_classes: 10
g_n_T: 400
g_ws_final: 0.5
g_drop_prob: 0.1
g_betas: [1e-4, 0.02]
g_sample_each_class: 20

fl_iter_num: 30 #25
server_optim_c_lr: 0.005
server_batch_size: 32
server_c_epochs: 4
server_g_epochs: 8

# visualization
dist_type: "wasserstein" # "l2-geo", "wasserstein"
iter_start_gen: 0

# sensor detection
clients_eval_mode: "cross-eval" # "self-eval", "cross-eval"
master_sensor: 'CLIP'
train_datasize_per_label: 300