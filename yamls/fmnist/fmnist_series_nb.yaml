cuda_device: 3
if_series: True

# defense methods
defense: "AGGR" # "AGGR",
# "krum", "geometric_median", "coordinate_wise_median", "fedavg", "fltrust"
aggr: 'normbound'
aggr_c_lr: 1.0
aggr_g_lr: 1.0
fltrust_root_iid: True

# sensors
sensor_dir: "saved_models"
sensor_models: []
master_sensor: "none"
sensor_embed_dim: 256

# fl client
n: 100 # total clients 
m: 20 # malicious clients
clients_per_iter: 10
fl_class_num: 10
fl_task: 'fmnist'
c_model: "ConvNet" #  "ConvNet", "SimpleCNN_28", "LeNet5", "MobileNetV2_28"
noniid_type: 'dirichlet' # "p-degree", "label_skew"
dirichlet_alphas: [0.1, 0.5]
# ['none',  'MPAF',  'MinMax', 'MinSum', 'LIE', 'label_perturbation', 'reverse_grad', 'fang',  'FedOda']
attack_methods: ['FedOda', 'MinMax', 'MinSum', 'reverse_grad', 'fang']
# only for reverse_grad, backdoor 
attack_magnitude: 1

image_size: [1, 28, 28]
c_epochs: 1 # 2, 5, 10
c_lr: 0.0001
c_momentum: 0.9
client_batch_size: 64

fl_iter_num: 300
server_optim_c_lr: 0.005
server_batch_size: 64
server_c_epochs: 1
server_g_epochs: 1


# FedOda parameters
fedoda:
  E: 5
  scaling_factor: 5
  reduce_factor: 0.9
  increase_factor: 1.05
  threshold: 0.5


clients_eval_mode: "cross-eval" # "self-eval", "cross-eval"
