cuda_device: 7
if_series: True

# defense methods
defense: "FedEval" # "AGGR", "FedEval"
# "krum", "geometric_median", "coordinate_wise_median", "fedavg", "fltrust"
aggr: "none"
aggr_c_lr: 0.7
aggr_g_lr: 1.0
fltrust_root_iid: True # False, True
ktop: 0.5
ktop_threshold_acc: 0.5
ktop_threshold_clients: 0.5

# sensors
sensor_dir: "saved_models"
sensor_models: []
master_sensor: "CLIP"
sensor_embed_dim: 512

# fl client
n: 3 # total clients 
m: 1 # malicious clients
fl_class_num: 10
clients_per_iter: 3
fl_task: 'cifar10'
c_model: "Celeba_5L"
g_model: "ContextUnet"
ddmp_seq: 8 # 7 for 28*28, 8 for 32*32
noniid_type: "label_skew"
label_skew_alphas: [0.8]
attack_methods: ['fakedata']
# only for reverse_grad, backdoor 
attack_magnitude: 5

image_size: [3, 32, 32]
c_epochs: 1 # 2, 5, 10
c_lr: 0.001
c_momentum: 0.9
client_batch_size: 64

g_epochs: 1 # 5, 10
g_lr: 1e-4
# g_batch_size: 256
g_in_channels: 3 # 3 for svhn, 1 for mnist
g_n_feat: 128
unet_classes: 10
g_n_T: 400
g_ws_final: 1.0
g_drop_prob: 0.1
g_betas: [1e-4, 0.02]
g_sample_each_class: 10

fl_iter_num: 25 #25
server_optim_c_lr: 0.005
server_batch_size: 32
server_c_epochs: 10
server_g_epochs: 20

# visualization
dist_type: "wasserstein" # "l2-geo", "wasserstein"
iter_start_gen: 0

# sensor detection
clients_eval_mode: "no-eval" # "self-eval", "cross-eval"
train_datasize_per_label: 100
init_c_epochs: 0
init_g_epochs: 0