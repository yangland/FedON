cuda_device: 0
if_series: False

# defense methods
defense: "AGGR" # "AGGR", "FedEval"
# "geometric_median", "coordinate_wise_median", "fedavg", "fltrust", 'trimmed_mean', "krum", 'normbound', "multi-krum"
aggr: 'flame'
aggr_c_lr: 1 # 0.75
aggr_g_lr: 1 # 1.0
fltrust_root_iid: True # False, True

# sensors
sensor_dir: "saved_models"
sensor_models: [] # "cifar10_none_20240906.pth",
master_sensor: "none" # "CLIP", "FID", "none"
sensor_embed_dim: 256

# fl client
n: 100 # total clients 
m: 20 # malicious clients
clients_per_iter: 10
fl_class_num: 10
fl_task: 'cifar10'
c_model: "ConvNet" # "Mnist_6L" ConvNet
g_model: "ContextUnet"
ddmp_seq: 8 # 7 for 28*28, 8 for 32*32
noniid_type: 'dirichlet' # "p-degree", "label_skew"
dirichlet_alpha: 1.0
# '['2_label_flipping', 'MPAF', 'backdoor', 'label_perturbation', 'fakedata', 
# 'clear_label_backdoor', 'reverse_grad', 'fang', 'MinMax', 'MinSum', 'LIE', 'dba', 'FedOda']
attack_method: 'FedOda'


image_size: [3, 32, 32]
c_epochs: 1 # 2, 5, 10
c_lr: 0.01
c_momentum: 0.9
client_batch_size: 64

fl_iter_num: 100
server_optim_c_lr: 0.005
server_batch_size: 64
server_c_epochs: 1
server_g_epochs: 1


clients_eval_mode: "cross-eval" # "self-eval", "cross-eval"
