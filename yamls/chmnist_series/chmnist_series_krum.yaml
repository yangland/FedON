cuda_device: 6
if_series: True

# defense methods
defense: "AGGR" # "AGGR", "FedEval"
# "krum", "geometric_median", "coordinate_wise_median", "fedavg", "fltrust"
aggr: "krum"
aggr_c_lr: 0.4
aggr_g_lr: 1.0
fltrust_root_iid: False

# sensors
sensor_dir: "saved_models"
sensor_models: ["cifar10_none_20240906.pth", "svhn_none_20240906.pth"]
master_sensor: "CLIP"
sensor_embed_dim: 256

# fl client
n: 15 # total clients 
m: 3 # malicious clients
clients_per_iter: 5
fl_class_num: 8
fl_task: 'ch'
c_model: "Celeba_5L"
g_model: "ContextUnet"
ddmp_seq: 16 # 7 for 28*28, 8 for 32*32
noniid_type: "label_skew"
label_skew_alphas: [0.5, 1.0]
attack_methods: ['none', 'fakedata',  'reverse_grad', 'label_perturbation'ion', 'fang', 'backdoor']
# only for reverse_grad, backdoor 
attack_magnitude: 5

image_size: [3, 64, 64]
c_epochs: 15 # 2, 5, 10
c_lr: 0.01
c_momentum: 0.9
client_batch_size: 64

g_epochs: 20 # 5, 10
g_lr: 1e-4
# g_batch_size: 256
g_in_channels: 3 # 3 for svhn, 1 for mnist
g_n_feat: 128
unet_classes: 8
g_n_T: 400
g_ws_final: 0.5
g_drop_prob: 0.1
g_betas: [1e-4, 0.02]
g_sample_each_class: 20

fl_iter_num: 50 #25
server_optim_c_lr: 0.005
server_batch_size: 32
server_c_epochs: 15
server_g_epochs: 20

# visualization
dist_type: "wasserstein" # "l2-geo", "wasserstein"
iter_start_gen: 0

# sensor detection
clients_eval_mode: "cross-eval" # "self-eval", "cross-eval"
master_sensor: 'CLIP'
train_datasize_per_label: 500