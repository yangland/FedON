cuda_device: 0
if_series: True

# defense methods
defense: "AGGR" # "AGGR", "FedEval"
# "krum", "geometric_median", "coordinate_wise_median", "fedavg", "fltrust"
aggr: "flame"
aggr_c_lr: 0.7
aggr_g_lr: 1.0
fltrust_root_iid: False

# sensors
sensor_dir: "saved_models"
sensor_models: []
master_sensor: "none"
sensor_embed_dim: 512

# fl client
n: 10 # total clients 
m: 4 # malicious clients
clients_per_iter: 10
fl_class_num: 10
fl_task: 'cifar10'
c_model: "ConvNet"
g_model: "ContextUnet"
ddmp_seq: 8 # 7 for 28*28, 8 for 32*32
noniid_type: 'dirichlet'
dirichlet_alphas: [0.5]
# ['none', 'fang', 'reverse_grad']
# ['2_label_flipping', 'label_perturbation'ion', 'fakedata', 'reverse_grad', 'fang', 'none']
attack_methods: ['MPAF']
# only for reverse_grad, backdoor 
attack_magnitude: 1
ds_percentage: 0.2

image_size: [3, 32, 32]
c_epochs: 2 # 2, 5, 10
c_lr: 0.01
c_momentum: 0.9
client_batch_size: 64

g_epochs: 4 # 5, 10
g_lr: 1e-4
# g_batch_size: 256
g_in_channels: 3 # 3 for svhn, 1 for mnist
g_n_feat: 128
unet_classes: 10
g_n_T: 400
g_ws_final: 0.5 # 0.5
g_drop_prob: 0.1
g_betas: [1e-4, 0.02]
g_sample_each_class: 10

fl_iter_num: 200
server_optim_c_lr: 0.005
server_batch_size: 64
server_c_epochs: 1
server_g_epochs: 1



# visualization
dist_type: "wasserstein" # "l2-geo", "wasserstein"
iter_start_gen: 0


# sensor detection
clients_eval_mode: "cross-eval" # "self-eval", "cross-eval"
train_datasize_per_label: 100
init_c_epochs: 1
init_g_epochs: 1
sensor_measure: "geometric_median" # "Wasserstein"
server_model_agr: "weighted_avg" # "generation"