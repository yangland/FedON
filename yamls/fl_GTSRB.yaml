cuda_device: 7
if_series: False

# defense methods
defense: "AGGR" # "AGGR", "FedEval"
# "geometric_median", "coordinate_wise_median", "fedavg", "fltrust", 'trimmed_mean', "krum", 'normbound', "multi-krum"
aggr: "fedavg" # "multi-krum", "fedavg", "fltrust"
aggr_c_lr: 1 # 0.75
aggr_g_lr: 1 # 1.0
fltrust_root_iid: True # False, True


# sensors
sensor_dir: "saved_models"
sensor_models: [] # "cifar10_none_20240906.pth",
master_sensor: "none" # "CLIP", "FID", "none"
sensor_embed_dim: 256

# fl client
n: 100 # total clients 
m: 20 # malicious clients
clients_per_iter: 10
fl_class_num: 43
fl_task: 'GTSRB'
c_model: "MobileNetV2" # "ConvNet", "ResNet18", "VGG13_32", "SqueezeNet_32", "SimpleCNN_32"
ddmp_seq: 8 # 7 for 28*28, 8 for 32*32
noniid_type: 'dirichlet' # "p-degree", "label_skew"
dirichlet_alpha: 1.0
# '['2_label_flipping', 'MPAF', 'backdoor', 'label_perturbation', 'fakedata', 
# 'clear_label_backdoor', 'reverse_grad', 'fang', 'MinMax', 'MinSum', 'LIE', 'dba', 'FedOda']
attack_method: 'none'


image_size: [3, 48, 48]
c_epochs: 1 # 2, 5, 10
c_lr: 0.001
c_momentum: 0.9
c_weight_decay: 0.0005
client_batch_size: 64

fl_iter_num: 500
server_optim_c_lr: 0.005
server_batch_size: 64
server_c_epochs: 1
server_g_epochs: 1

# FedOda parameters
fedoda:
  E: 5
  scaling_factor: 8
  reduce_factor: 0.9
  increase_factor: 1.05
  threshold: 0.6

clients_eval_mode: "cross-eval" # "self-eval", "cross-eval"
rl_mode: "PCAC"  # "RANDOM"

attack:
  mode: PGD
  pgd_steps: 20
  pgd_lr: 0.1
  alpha: 0.1
  lambda_cos: 0.1
  retry_limit: 5
  harm_threshold: 0.0
  epsilon_growth: 1.0
  cos_growth: 0.9

  # PCAC exploration parameters
  exploration_mode: noise     # or "epsilon"
  epsilon: 1.0
  epsilon_min: 0.05
  epsilon_decay: 0.995

  # PCAC noise adaptation parameters
  noise_init: 0.5
  noise_min: 0.05
  noise_max: 0.5
  noise_decay: 0.9
  noise_growth: 1.1
  noise_alpha: 0.05

