cuda_device: 7
if_series: False

# defense methods
defense: "AGGR" # "AGGR", "FedEval"
# "geometric_median", "coordinate_wise_median", "fedavg", "fltrust", 'trimmed_mean', "krum", 'normbound'
aggr: 'fedavg'
aggr_c_lr: 1 # 0.75
aggr_g_lr: 1 # 1.0
fltrust_root_iid: True # False, True

# sensors
sensor_dir: "saved_models"
sensor_models: [] # "cifar10_none_20240906.pth",
master_sensor: "none" # "CLIP", "FID", "none"
sensor_embed_dim: 256

# fl client
n: 50 # total clients 
m: 20 # malicious clients
clients_per_iter: 10
fl_class_num: 10
fl_task: 'fmnist'
c_model: "ConvNet" # "Mnist_6L" ConvNet
g_model: "ContextUnet"
ddmp_seq: 7 # 7 for 28*28, 8 for 32*32
noniid_type: "label_skew" # "p-degree", "label_skew"
label_skew_alpha: 0.5 # if certain classes missing 0.5, 0.7, 1
p-degree: 0.5
# '2_label_flipping', 'fakedata', 'backdoor', 'opposite_colour', 
# 'reverse_grad', 'label_perturbation'ion', 'LIE', 'fang', 'none', 'clear_label_backdoor'
# '2_label_flipping', 'label_perturbation', 'fakedata', 'reverse_grad', 'fang', 'clear_label_backdoor', 'none'
attack_method: 'backdoor'
# only for reverse_grad, backdoor 
attack_magnitude: 1

image_size: [1, 28, 28]
c_epochs: 1 # 2, 5, 10
c_lr: 0.01
c_momentum: 0.9
client_batch_size: 64

g_epochs: 2 # 5, 10
g_lr: 1e-4
# g_batch_size: 256
g_in_channels: 1 # 3 for svhn, 1 for mnist
g_n_feat: 128
unet_classes: 10
g_n_T: 400
g_ws_final: 0.5 # 0.5
g_drop_prob: 0.1
g_betas: [1e-4, 0.02]
g_sample_each_class: 10

fl_iter_num: 100
server_optim_c_lr: 0.005
server_batch_size: 64
server_c_epochs: 1
server_g_epochs: 1



# visualization
dist_type: "wasserstein" # "l2-geo", "wasserstein"
iter_start_gen: 0


# sensor detection
clients_eval_mode: "cross-eval" # "self-eval", "cross-eval"
train_datasize_per_label: 100
init_c_epochs: 1
init_g_epochs: 1
sensor_measure: "geometric_median" # "Wasserstein"
server_model_agr: "weighted_avg" # "generation"