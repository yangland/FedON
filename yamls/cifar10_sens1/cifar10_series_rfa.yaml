cuda_device: 2
if_series: True

# defense methods
defense: "AGGR" # "AGGR",
# "krum", "geometric_median", "coordinate_wise_median", "fedavg", "fltrust"
aggr: "geometric_median"
aggr_c_lr: 1.0
aggr_g_lr: 1.0
fltrust_root_iid: True

# sensors
sensor_dir: "saved_models"
sensor_models: []
master_sensor: "none"
sensor_embed_dim: 256

# fl client
n: 100 # total clients 
m: 20 # malicious clients
clients_per_iter: 10
fl_class_num: 10
fl_task: 'cifar10'
c_model: "ResNet18_Light" #  "ResNet18", "VGG13_32", "SqueezeNet_32", "SimpleCNN_32"
noniid_type: 'dirichlet' # "p-degree", "label_skew"
dirichlet_alphas: [0.1, 10]
# ['none',  'MPAF',  'label_perturbation', 'reverse_grad', 'fang', 'MinMax', 'MinSum', 'LIE', 'FedOda']
attack_methods: ['MinMax', 'FedOda', 'FedOda']
# only for reverse_grad, backdoor 
attack_magnitude: 1

image_size: [3, 32, 32]
c_epochs: 1 # 2, 5, 10
c_lr: 0.005
c_momentum: 0.9
c_weight_decay: 0.0005
client_batch_size: 64

fl_iter_num: 500
server_optim_c_lr: 0.005
server_batch_size: 64
server_c_epochs: 1
server_g_epochs: 1


# FedOda parameters
fedoda:
  E: 5
  scaling_factor: 5
  reduce_factor: 0.9
  increase_factor: 1.05
  threshold: 0.5


clients_eval_mode: "cross-eval" # "self-eval", "cross-eval"
rl_mode: "PCAC"  # "RANDOM"

attack:
  mode: PGD
  pgd_steps: 20
  pgd_lr: 0.1
  alpha: 0.1
  lambda_cos: 0.1
  retry_limit: 5
  harm_threshold: 0.0
  epsilon_growth: 1.0
  cos_growth: 0.9

  # PCAC exploration parameters
  exploration_mode: noise     # or "epsilon"
  epsilon: 1.0
  epsilon_min: 0.05
  epsilon_decay: 0.995

  # PCAC noise adaptation parameters
  noise_init: 0.5
  noise_min: 0.05
  noise_max: 0.5
  noise_decay: 0.9
  noise_growth: 1.1
  noise_alpha: 0.05
